# Bibliography: ch7 — see notes/taxonomy.yaml for the structure.
# Two facets per entry:
#   role  — what job the citation does in the argument
#   tier  — D primary / A adjacent / B boundary / V others' survey / S own
#   deck_rank — position in the corrected deck's citation string
#               (-1 marks this survey's own proposal; 999 = unnamed)

- section: "7.1"
  papers:
    - title: 'Automated Design of Agentic Systems (Meta Agent Search)'
      venue: 'ICLR 2025'
      links: {'paper': 'https://arxiv.org/abs/2408.08435'}
      role: representative
      tier: A
      deck_rank: 0
      why: 'The strongest transfer evidence in the chapter — agents invented in code by a meta agent keep outperforming hand-designed agents even when transferred across domains and models.'
    - title: 'Darwin Gödel Machine: Open-Ended Evolution of Self-Improving Agents'
      venue: 'ICLR 2026'
      links: {'paper': 'https://arxiv.org/abs/2505.22954', 'code': 'https://github.com/jennyzzt/dgm'}
      role: representative
      tier: D
      deck_rank: 1
      why: 'The central modern instantiation: it keeps an archive of self-modified agents and steers open-ended exploration over which modification to attempt next, replacing the unprovable beneficial test with empirical coding benchmarks.'
    - title: 'Gödel Machines: Fully Self-Referential Optimal Universal Self-Improvers'
      venue: 'arXiv 2003'
      links: {'paper': 'https://arxiv.org/abs/cs.LO/0309048'}
      role: foundational
      tier: D
      deck_rank: 999
      why: 'The theoretical origin: it defines self-modification as rewrite your own code only when you can prove the rewrite is net beneficial, the standard against which every empirical proposal-selection mechanism below is judged.'
    - title: 'Huxley-Gödel Machine: Human-Level Coding Agent Development by an Approximation of the Optimal Self-Improving Machine'
      venue: 'ICLR 2026'
      links: {'paper': 'https://arxiv.org/abs/2510.21614', 'code': 'https://github.com/metauto-ai/HGM'}
      role: representative
      tier: D
      deck_rank: 999
      why: 'Directly attacks proposal selection: it shows the field''s implicit heuristic of expanding the highest-scoring agent is a mismatch, and replaces it with a lineage-aggregate signal — the sharpest statement that choosing what to improve is itself a searchable problem.'
    - title: 'A Self-Improving Coding Agent (SICA)'
      venue: 'arXiv 2025'
      links: {'paper': 'https://arxiv.org/abs/2504.15228', 'code': 'https://github.com/MaximeRobeyns/self_improving_coding_agent'}
      role: representative
      tier: D
      deck_rank: 999
      why: 'Collapses meta-agent and target-agent into one system that edits its own codebase, making which self-modification to attempt a concrete per-iteration decision over a utility that weighs performance against cost and time.'
    - title: 'Live-SWE-agent: Can Software Engineering Agents Self-Evolve on the Fly?'
      venue: 'arXiv 2025'
      links: {'paper': 'https://arxiv.org/abs/2511.13646', 'code': 'https://github.com/OpenAutoCoder/live-swe-agent'}
      role: representative
      tier: D
      deck_rank: 999
      why: 'Moves proposal and selection inside a single task, letting the agent decide mid-episode to synthesize a new tool — the runtime end of the spectrum that contrasts with costly offline evolution.'
    - title: 'Self-Taught Optimizer (STOP): Recursively Self-Improving Code Generation'
      venue: 'COLM 2024'
      links: {'paper': 'https://arxiv.org/abs/2310.02304'}
      role: representative
      tier: D
      deck_rank: 999
      why: 'The cleanest minimal instance: a seed improver is run on itself and the model proposes concrete improvement strategies that are then selected by utility — and it is the paper that most carefully draws the RSI boundary.'
    - title: 'Gödel Agent: A Self-Referential Agent Framework for Recursive Self-Improvement'
      venue: 'ACL 2025'
      links: {'paper': 'https://arxiv.org/abs/2410.04444'}
      role: representative
      tier: D
      deck_rank: 999
      why: 'Lets an agent modify its own logic and behaviour guided only by high-level objectives, showing self-generated proposals can surpass hand-designed agents — the LLM-era direct nod to the Gödel machine framework.'
    - title: 'AlphaEvolve: A Gemini-Powered Coding Agent for Designing Advanced Algorithms'
      venue: 'Google DeepMind 2025'
      links: {'paper': 'https://deepmind.google/blog/alphaevolve-a-gemini-powered-coding-agent-for-designing-advanced-algorithms/'}
      role: representative
      tier: D
      deck_rank: 999
      why: 'An evolutionary propose-and-select loop where every candidate is automatically verifiable, resolving the proposal-selection problem in the narrow but real domain of algorithms and proving it in production.'
    - title: 'AgentSquare: Automatic LLM Agent Search in Modular Design Space'
      venue: 'ICML 2025'
      links: {'paper': 'https://arxiv.org/abs/2410.06153'}
      role: representative
      tier: D
      deck_rank: 999
      why: 'Constrains proposals to a modular space and adds a surrogate performance predictor to skip unpromising designs — the efficiency argument for how proposals should be selected rather than enumerated.'
    - title: 'Voyager: An Open-Ended Embodied Agent with Large Language Models'
      venue: 'TMLR 2024'
      links: {'paper': 'https://arxiv.org/abs/2305.16291'}
      role: representative
      tier: D
      deck_rank: 999
      why: 'Its automatic curriculum plus skill library is a controller that compounds, the canonical example that control can be improved over a lifetime of episodes.'
    - title: 'Self-Adapting Language Models (SEAL)'
      venue: 'arXiv 2025'
      links: {'paper': 'https://arxiv.org/abs/2506.10943', 'code': 'https://github.com/Continual-Intelligence/SEAL'}
      role: representative
      tier: D
      deck_rank: 999
      why: 'Extends proposal and selection from code scaffolds to weights: the model proposes its own finetuning data and update directives, selected by downstream performance — the parametric frontier of self-modification.'

- section: "7.2"
