    - title: 'Beyond Meta-Reasoning: Metacognitive Consolidation for Self-Improving LLM Reasoning (MC-squared)'
      venue: 'ACL 2026'
      links: {'paper': 'https://aclanthology.org/2026.acl-long.1095/'}
      role: boundary
      tier: D
      deck_rank: 0
      why: 'Its authors state that consolidation is currently task-specific with no cross-task transfer yet — a self-declared limitation honestly marking the edge of what meta-knowledge transfer delivers today.'
