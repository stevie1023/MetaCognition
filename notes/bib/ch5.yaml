# Bibliography: ch5 — see notes/taxonomy.yaml for the structure.
# Two facets per entry:
#   role  — what job the citation does in the argument
#   tier  — D primary / A adjacent / B boundary / V others' survey / S own
#   deck_rank — position in the corrected deck's citation string
#               (-1 marks this survey's own proposal; 999 = unnamed)

- section: "5.1"
  papers:
    - title: 'A Signal Detection Theoretic Approach for Estimating Metacognitive Sensitivity from Confidence Ratings'
      venue: 'Consciousness and Cognition 2012'
      links: {'paper': 'https://doi.org/10.1016/j.concog.2011.09.021'}
      role: foundational
      tier: D
      deck_rank: 0
      why: 'Introduces meta-d-prime and the signal-detection framework separating metacognitive sensitivity from response bias; supplies the theoretical basis for AUROC-style discrimination metrics and for the argument that raw confidence is confounded by bias.'
    - title: 'Language Models (Mostly) Know What They Know'
      venue: 'arXiv 2022'
      links: {'paper': 'https://arxiv.org/abs/2207.05221'}
      role: foundational
      tier: D
      deck_rank: 1
      why: 'Establishes that models carry a usable internal signal (P(True), P(IK)) about answer correctness, grounding the entire monitoring literature.'
    - title: 'How to Measure Metacognition'
      venue: 'Frontiers in Human Neuroscience 2014'
      links: {'paper': 'https://doi.org/10.3389/fnhum.2014.00443'}
      role: foundational
      tier: D
      deck_rank: 999
      why: 'Defines the bias/sensitivity/efficiency triple and imports signal-detection measures, supplying the metric vocabulary the evaluation chapter adopts.'
    - title: 'On Calibration of Modern Neural Networks'
      venue: 'ICML 2017'
      links: {'paper': 'https://proceedings.mlr.press/v70/guo17a.html'}
      role: foundational
      tier: D
      deck_rank: 999
      why: 'The pre-LLM baseline: modern nets are miscalibrated and temperature scaling partly fixes it — the reference point against which LLM-specific calibration is measured.'
    - title: 'Just Ask for Calibration: Strategies for Eliciting Calibrated Confidence Scores from LLMs'
      venue: 'EMNLP 2023'
      links: {'paper': 'https://aclanthology.org/2023.emnlp-main.330/'}
      role: representative
      tier: D
      deck_rank: 999
      why: 'Shows RLHF degrades logit calibration while verbalized confidence recovers much of it — the key result separating distorted output from lost internal certainty.'
    - title: 'Semantic Uncertainty: Linguistic Invariances for Uncertainty Estimation in Natural Language Generation'
      venue: 'ICLR 2023'
      links: {'paper': 'https://arxiv.org/abs/2302.09664'}
      role: representative
      tier: D
      deck_rank: 999
      why: 'Introduces semantic entropy, moving uncertainty from token sequences to meanings — the conceptual fix that makes free-form calibration tractable.'
    - title: 'Detecting Hallucinations in Large Language Models Using Semantic Entropy'
      venue: 'Nature 2024'
      links: {'paper': 'https://doi.org/10.1038/s41586-024-07421-0'}
      role: benchmark
      tier: A
      deck_rank: 999
      why: 'Elevates semantic entropy to a validated confabulation detector with a Nature-scale generalization claim, anchoring the strongest-calibration-signal argument.'
    - title: 'A Survey of Confidence Estimation and Calibration in Large Language Models'
      venue: 'NAACL 2024'
      links: {'paper': 'https://aclanthology.org/2024.naacl-long.366/'}
      role: positioning
      tier: V
      deck_rank: 999
      why: 'Organizes white-box versus black-box confidence methods and metrics (ECE, SCE, ACE, AUROC, AUARC), providing the taxonomy this section maps onto.'
    - title: 'Decoupling Metacognition from Cognition: A Framework for Evaluating Metacognition in LLMs'
      venue: 'AAAI 2025'
      links: {'paper': 'https://doi.org/10.1609/aaai.v39i24.34723'}
      role: representative
      tier: D
      deck_rank: 999
      why: 'Operationalizes ''genuinely metacognitive'' as ability independent of cognitive ability, giving the definition boundary a quantitative test.'
    - title: 'What Large Language Models Know and What People Think They Know'
      venue: 'Nature Machine Intelligence 2025'
      links: {'paper': 'https://doi.org/10.1038/s42256-024-00976-7'}
      role: positioning
      tier: V
      deck_rank: 999
      why: 'Separates the calibration gap between user and model confidence from the discrimination gap, arguing internal confidence exists but is poorly communicated.'

- section: "5.2"
  papers:
    - title: 'AutoMix: Automatically Mixing Language Models'
      venue: 'NeurIPS 2024'
      links: {'paper': 'https://arxiv.org/abs/2310.12963'}
      role: representative
      tier: D
      deck_rank: 0
      why: 'Models the controller as a partially observable Markov decision process whose observation is explicitly noisy, the correct formalization when the monitoring signal itself is unreliable.'
    - title: 'RouteLLM: Learning to Route LLMs with Preference Data'
      venue: 'ICLR 2025'
      links: {'paper': 'https://openreview.net/forum?id=TriSxazD2A'}
      role: representative
      tier: A
      deck_rank: 1
      why: 'Learns the routing policy directly from preference data with a cost-aware objective, showing the utility trade-off can be trained rather than hand-specified.'
    - title: 'Reasoning in Token Economies: Budget-Aware Evaluation of LLM Reasoning Strategies'
      venue: 'EMNLP 2024'
      links: {'paper': 'https://arxiv.org/abs/2406.06461', 'acl': 'https://aclanthology.org/2024.emnlp-main.1112/'}
      role: contrast
      tier: B
      deck_rank: 999
      why: 'The compute-matched control that deflates most intervention claims: many smarter step-level strategies fail to beat plain self-consistency at equal budget, so any claimed payoff from a trigger must survive this evaluation.'
    - title: 'AbstentionBench: Reasoning LLMs Fail on Unanswerable Questions'
      venue: 'arXiv 2025'
      links: {'paper': 'https://arxiv.org/abs/2506.09038'}
      role: benchmark
      tier: A
      deck_rank: 999
      why: 'A systematic benchmark in which abstention is the utility-bearing action; used to show that utility gains from monitoring can be negative if the abstention policy is miscalibrated.'
    - title: 'LLMs Have Intrinsic Meta-Cognition, but Need a Good Lens'
      venue: 'EMNLP 2025'
      links: {'paper': 'https://aclanthology.org/2025.emnlp-main.171/'}
      role: representative
      tier: D
      deck_rank: 999
      why: 'Distinguishes the intrinsic metacognitive signal from the imperfect readout, giving the mechanism-versus-measurement distinction for step-level confidence.'
    - title: 'Scaling LLM Test-Time Compute Optimally Can Be More Effective than Scaling Model Parameters'
      venue: 'ICLR 2025'
      links: {'paper': 'https://arxiv.org/abs/2408.03314'}
      role: foundational
      tier: D
      deck_rank: 999
      why: 'The axis-setting result: it defines compute-optimal allocation and shows the best distribution of a fixed budget depends on prompt difficulty, which is the formal statement of the allocation problem.'
    - title: 'To CoT or Not to CoT? Chain-of-Thought Helps Mainly on Math and Symbolic Reasoning'
      venue: 'ICLR 2025'
      links: {'paper': 'https://arxiv.org/abs/2409.12183'}
      role: boundary
      tier: B
      deck_rank: 999
      why: 'Shows the budget''s marginal value is category-dependent and often near zero, the boundary condition any allocation policy must encode rather than assume away.'
    - title: 'A Survey of Confidence Estimation and Calibration in Large Language Models'
      venue: 'NAACL 2024'
      links: {'paper': 'https://aclanthology.org/2024.naacl-long.366/'}
      role: positioning
      tier: V
      deck_rank: 999
      why: 'Organizes white-box versus black-box confidence methods and metrics (ECE, SCE, ACE, AUROC, AUARC), providing the taxonomy this section maps onto.'

- section: "5.3"
  papers:
    - title: 'Survey protocol: compare Q estimates to outcomes'
      venue: 'this survey (proposal)'
      links: {}
      role: positioning
      tier: S
      deck_rank: -1
      why: 'The evaluation protocol this survey proposes but no cited paper runs end to end: record the controller''s ex-ante expected utility Q at each decision point, then score it against the realized gain.'
    - title: 'AutoMix: Automatically Mixing Language Models'
      venue: 'NeurIPS 2024'
      links: {'paper': 'https://arxiv.org/abs/2310.12963'}
      role: representative
      tier: A
      deck_rank: 0
      why: 'Models the controller as a partially observable Markov decision process whose observation is explicitly noisy, the correct formalization when the monitoring signal itself is unreliable.'
    - title: 'MUR: Momentum Uncertainty Guided Reasoning for Large Language Models'
      venue: 'ACL 2026'
      links: {'paper': 'https://arxiv.org/abs/2507.14958', 'acl': 'https://aclanthology.org/2026.acl-long.1058'}
      role: representative
      tier: A
      deck_rank: 1
      why: 'Replaces uniform test-time scaling with a per-step intervention trigger driven by time-aggregated uncertainty, and supplies the control knob that makes ''when to intervene'' a single tunable policy — the definitional instantiation of a monitoring-to-control hook.'
    - title: 'How Overconfidence in Initial Choices Corrupts Reasoning'
      venue: 'arXiv 2025'
      links: {'paper': 'https://arxiv.org/abs/2507.03120'}
      role: contrast
      tier: B
      deck_rank: 999
      why: 'Demonstrates the controller''s own value estimates are systematically overconfident early, so expected utility diverges from realized — the core expected-versus-realized pathology in this subsection.'
    - title: 'Do Large Language Models Know What They Are Capable Of?'
      venue: 'ICLR 2026'
      links: {'paper': 'https://openreview.net/forum?id=EO6WtJ0q6G'}
      role: contrast
      tier: B
      deck_rank: 999
      why: 'Shows systematic overconfidence worsening across multi-step tasks with no scaling benefit in discrimination — the decisive negative result for capability self-knowledge.'
    - title: 'What Large Language Models Know and What People Think They Know'
