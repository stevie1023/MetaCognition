- section: "8.5"
  papers:
    - title: 'Darwin Gödel Machine: Open-Ended Evolution of Self-Improving Agents'
      venue: 'ICLR 2026'
      links: {'paper': 'https://arxiv.org/abs/2505.22954', 'code': 'https://github.com/jennyzzt/dgm'}
      role: representative
      tier: A
      deck_rank: 0
      why: 'The central modern instantiation: it keeps an archive of self-modified agents and steers open-ended exploration over which modification to attempt next, replacing the unprovable beneficial test with empirical coding benchmarks.'
    - title: 'Self-Taught Optimizer (STOP): Recursively Self-Improving Code Generation'
      venue: 'COLM 2024'
      links: {'paper': 'https://arxiv.org/abs/2310.02304'}
      role: representative
      tier: B
      deck_rank: 1
      why: 'The cleanest minimal instance: a seed improver is run on itself and the model proposes concrete improvement strategies that are then selected by utility — and it is the paper that most carefully draws the RSI boundary.'
    - title: 'On the Statistical Limits of Self-Improving Agents'
      venue: 'arXiv 2025'
      links: {'paper': 'https://arxiv.org/abs/2510.04399'}
      role: foundational
      tier: D
      deck_rank: 999
      why: 'Supplies the theoretical gate: a two-gate guardrail combining a validation margin with a capacity cap is shown to be necessary and sufficient for preserving learnability, turning ad-hoc sandboxing into a principled acceptance rule.'
    - title: 'Position: Truly Self-Improving Agents Require Intrinsic Metacognitive Learning'
      venue: 'ICML 2025'
      links: {'paper': 'https://proceedings.mlr.press/v267/liu25cw.html'}
      role: positioning
      tier: V
      deck_rank: 999
      why: 'Applies cost-benefit metacontrol to the learning-allocation decision (what and when to learn), extending value of computation beyond a single inference episode.'
    - title: 'AI Models Collapse When Trained on Recursively Generated Data'
      venue: 'Nature 2024'
      links: {'paper': 'https://www.nature.com/articles/s41586-024-07566-y'}
      role: boundary
      tier: B
      deck_rank: 999
      why: 'The canonical instability of recursive self-training: tails of the true distribution disappear over generations, a concrete mechanism by which self-improvement degrades.'
    - title: 'Recursive Self-Improvement in AI'
      venue: 'arXiv 2026'
      links: {'paper': 'https://arxiv.org/abs/2607.07663'}
      role: positioning
      tier: V
      deck_rank: 999
      why: 'Surveys recursive self-improvement mechanisms and failure modes, the organizing reference for what stability must mean.'
    - title: 'Calibrated Language Models Must Hallucinate'
      venue: 'STOC 2024'
      links: {'paper': 'https://arxiv.org/abs/2311.14648'}
      role: boundary
      tier: B
      deck_rank: 999
      why: 'Proves a calibration-hallucination impossibility under realistic settings, the theoretical limit showing self-improvement cannot be perfectly stable in principle.'
    - title: 'Stop Overthinking: A Survey on Efficient Reasoning for Large Language Models'
      venue: 'TMLR 2025'
      links: {'paper': 'https://arxiv.org/abs/2503.16419'}
      role: positioning
      tier: V
      deck_rank: 999
      why: 'The taxonomy of runtime efficiency and failure-avoidance methods, mapping the design space this subsection must cover.'
    - title: 'To CoT or Not to CoT? Chain-of-Thought Helps Mainly on Math and Symbolic Reasoning'
      venue: 'ICLR 2025'
      links: {'paper': 'https://arxiv.org/abs/2409.12183'}
      role: boundary
      tier: B
      deck_rank: 999
      why: 'Shows the budget''s marginal value is category-dependent and often near zero, the boundary condition any allocation policy must encode rather than assume away.'
    - title: 'Evidence for Limited Metacognition in Large Language Models'
      venue: 'ICLR 2026'
      links: {'paper': 'https://arxiv.org/abs/2509.21545'}
      role: contrast
      tier: B
      deck_rank: 999
      why: 'Arguing self-reports are untrustworthy and testing strategic deployment instead, it sets the evidential bar any genuine-metacognition claim must clear.'

