- section: "5.4"
  papers:
    - title: 'Survey protocol: matched-state action ablations'
      venue: 'this survey (proposal)'
      links: {}
      role: positioning
      tier: S
      deck_rank: -1
      why: 'The attribution standard this survey proposes: intervene and withhold the metacognitive action from the same state, so that the difference is the action rather than the state that triggered it.'
    - title: 'Self-Refine: Iterative Refinement with Self-Feedback'
      venue: 'NeurIPS 2023'
      links: {'paper': 'https://arxiv.org/abs/2303.17651', 'code': 'https://github.com/madaan/self-refine'}
      role: representative
      tier: B
      deck_rank: 0
      why: 'The canonical claim that a model can improve its own output without external feedback, and therefore the primary target of the contrast cited next.'
    - title: 'Large Language Models Cannot Self-Correct Reasoning Yet'
      venue: 'ICLR 2024'
      links: {'paper': 'https://arxiv.org/abs/2310.01798'}
      role: contrast
      tier: B
      deck_rank: 1
      why: 'The canonical negative result that self-checking gains vanish under proper evaluation, forcing a distinction between metacognitive-looking behaviour and real self-regulation.'
    - title: 'On the Self-Verification Limitations of Large Language Models on Reasoning and Planning Tasks'
      venue: 'arXiv 2024'
      links: {'paper': 'https://arxiv.org/abs/2402.08115'}
      role: contrast
      tier: B
      deck_rank: 999
      why: 'The ablation that settles the debate: sound external verification helps, self-critique collapses performance, and the content of feedback barely matters — establishing that the bottleneck is verification soundness, not critique quality.'
    - title: 'SELF-[IN]CORRECT: LLMs Struggle with Discriminating Self-Generated Responses'
      venue: 'AAAI 2025'
      links: {'paper': 'https://arxiv.org/abs/2404.04298'}
      role: contrast
      tier: B
      deck_rank: 999
      why: 'Isolates self-discrimination from generation and shows it is weak; a controlled test showing the control signal is not causally effective even when present.'
    - title: 'Language Models Don''t Always Say What They Think: Unfaithful Explanations in Chain-of-Thought Prompting'
      venue: 'NeurIPS 2023'
      links: {'paper': 'https://arxiv.org/abs/2305.04388'}
      role: contrast
      tier: B
      deck_rank: 999
      why: 'Shows chain-of-thought rationales are not faithful to the actual computation; the placebo and unfaithfulness control that invalidates rationale-based attribution of metacognitive control.'
    - title: 'When Can LLMs Actually Correct Their Own Mistakes? A Critical Survey of Self-Correction of LLMs'
      venue: 'TACL 2024'
      links: {'paper': 'https://arxiv.org/abs/2406.01297'}
      role: positioning
      tier: V
      deck_rank: 999
      why: 'Systematizes the field into the conditions under which self-correction helps (reliable external feedback, weak-to-strong, task decomposability), giving the chapter its organizing framework for this subsection.'
    - title: 'LLMs Know More Than They Show: On the Intrinsic Representation of LLM Hallucinations'
      venue: 'ICLR 2025'
      links: {'paper': 'https://arxiv.org/abs/2410.02707'}
      role: boundary
      tier: B
      deck_rank: 999
      why: 'Shows the model internally encodes truthfulness but does not act on it; the counterfactual probe establishing that signal presence is not signal use — latent monitoring is overridden by output bias.'
    - title: 'AbstentionBench: Reasoning LLMs Fail on Unanswerable Questions'
      venue: 'arXiv 2025'
      links: {'paper': 'https://arxiv.org/abs/2506.09038'}
      role: benchmark
      tier: A
      deck_rank: 999
      why: 'A systematic benchmark in which abstention is the utility-bearing action; used to show that utility gains from monitoring can be negative if the abstention policy is miscalibrated.'
    - title: 'LLMs Have Intrinsic Meta-Cognition, but Need a Good Lens'
      venue: 'EMNLP 2025'
      links: {'paper': 'https://aclanthology.org/2025.emnlp-main.171/'}
      role: representative
      tier: D
      deck_rank: 999
      why: 'Distinguishes the intrinsic metacognitive signal from the imperfect readout, giving the mechanism-versus-measurement distinction for step-level confidence.'

