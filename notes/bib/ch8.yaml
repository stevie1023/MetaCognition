# Bibliography: ch8 — see notes/taxonomy.yaml for the structure.
# Two facets per entry:
#   role  — what job the citation does in the argument
#   tier  — D primary / A adjacent / B boundary / V others' survey / S own
#   deck_rank — position in the corrected deck's citation string
#               (-1 marks this survey's own proposal; 999 = unnamed)

- section: "8.1"
  papers:
    - title: 'Language Models Are Capable of Metacognitive Monitoring and Control of Their Internal Activations'
      venue: 'NeurIPS 2025'
      links: {'paper': 'https://arxiv.org/abs/2505.13763'}
      role: representative
      tier: D
      deck_rank: 0
      why: 'The neurofeedback paradigm quantifying report and control of activation directions and introducing the low-dimensional metacognitive space — the central method for this subsection.'
    - title: 'Self-Refine: Iterative Refinement with Self-Feedback'
      venue: 'NeurIPS 2023'
      links: {'paper': 'https://arxiv.org/abs/2303.17651', 'code': 'https://github.com/madaan/self-refine'}
      role: representative
      tier: B
      deck_rank: 1
      why: 'The canonical claim that a model can improve its own output without external feedback, and therefore the primary target of the contrast cited next.'
    - title: 'Metacognition in LLMs: Foundations, Progress, and Opportunities'
      venue: 'arXiv 2026'
      links: {'paper': 'https://arxiv.org/abs/2607.11881'}
      role: positioning
      tier: V
      deck_rank: 999
      why: 'The directly overlapping prior survey; cited here for its definitional scope, which this paper narrows and operationalizes.'
    - title: 'Evidence for Limited Metacognition in Large Language Models'
      venue: 'ICLR 2026'
      links: {'paper': 'https://arxiv.org/abs/2509.21545'}
      role: contrast
      tier: B
      deck_rank: 999
      why: 'Arguing self-reports are untrustworthy and testing strategic deployment instead, it sets the evidential bar any genuine-metacognition claim must clear.'
    - title: 'AI Awareness'
      venue: 'arXiv 2025'
      links: {'paper': 'https://arxiv.org/abs/2504.20084'}
      role: positioning
      tier: V
      deck_rank: 999
      why: 'Surveys the definitional sprawl of awareness and self-knowledge in LLMs, used to argue the boundary is currently definitional rather than empirical.'
    - title: 'Self-Recognition in Language Models'
      venue: 'EMNLP Findings 2024'
      links: {'paper': 'https://arxiv.org/abs/2407.06946'}
      role: contrast
      tier: B
      deck_rank: 999
      why: 'Shows self-recognition is fragile and prompt-dependent, the contrast case proving that a candidate boundary criterion (self-identification) is neither necessary nor sufficient.'
    - title: 'Looking Inward: Language Models Can Learn About Themselves by Introspection'
      venue: 'ICLR 2025'
      links: {'paper': 'https://arxiv.org/abs/2410.13787'}
      role: representative
      tier: D
      deck_rank: 999
      why: 'The privileged self-access test (a model predicts itself better than another model) supplies the cleanest methodological standard for genuine versus confabulated introspective access.'
    - title: 'Emergent Introspective Awareness in Large Language Models'
      venue: 'arXiv 2026 (Anthropic 2025)'
      links: {'paper': 'https://arxiv.org/abs/2601.01828'}
      role: foundational
      tier: D
      deck_rank: 999
      why: 'The concept-injection landmark establishing functional introspective awareness and intentional activation control, with a measured roughly 20 percent success rate and zero false positives — the anchor for this subsection.'
    - title: 'What Large Language Models Know and What People Think They Know'
      venue: 'Nature Machine Intelligence 2025'
      links: {'paper': 'https://doi.org/10.1038/s42256-024-00976-7'}
      role: positioning
      tier: V
      deck_rank: 999
      why: 'Separates the calibration gap between user and model confidence from the discrimination gap, arguing internal confidence exists but is poorly communicated.'
    - title: 'LLMs Have Intrinsic Meta-Cognition, but Need a Good Lens'
      venue: 'EMNLP 2025'
      links: {'paper': 'https://aclanthology.org/2025.emnlp-main.171/'}
      role: representative
      tier: D
      deck_rank: 999
      why: 'Distinguishes the intrinsic metacognitive signal from the imperfect readout, giving the mechanism-versus-measurement distinction for step-level confidence.'

- section: "8.2"
  papers:
    - title: 'Intervention-based value-of-information tests'
      venue: 'this survey (proposal)'
      links: {}
      role: positioning
      tier: S
      deck_rank: -1
      why: 'The test this survey proposes for causal signal value: perturb or withhold the monitor''s signal and measure whether behaviour changes, since correlation between a probe and an outcome is not evidence that the signal is used.'
    - title: 'AutoMix: Automatically Mixing Language Models'
      venue: 'NeurIPS 2024'
      links: {'paper': 'https://arxiv.org/abs/2310.12963'}
      role: representative
      tier: D
      deck_rank: 0
      why: 'Models the controller as a partially observable Markov decision process whose observation is explicitly noisy, the correct formalization when the monitoring signal itself is unreliable.'
    - title: 'LLMs Know More Than They Show: On the Intrinsic Representation of LLM Hallucinations'
      venue: 'ICLR 2025'
      links: {'paper': 'https://arxiv.org/abs/2410.02707'}
      role: boundary
      tier: B
      deck_rank: 999
      why: 'Shows the model internally encodes truthfulness but does not act on it; the counterfactual probe establishing that signal presence is not signal use — latent monitoring is overridden by output bias.'
    - title: 'Language Models Don''t Always Say What They Think: Unfaithful Explanations in Chain-of-Thought Prompting'
      venue: 'NeurIPS 2023'
      links: {'paper': 'https://arxiv.org/abs/2305.04388'}
      role: contrast
      tier: B
      deck_rank: 999
      why: 'Shows chain-of-thought rationales are not faithful to the actual computation; the placebo and unfaithfulness control that invalidates rationale-based attribution of metacognitive control.'
    - title: 'Language Models Are Capable of Metacognitive Monitoring and Control of Their Internal Activations'
      venue: 'NeurIPS 2025'
      links: {'paper': 'https://arxiv.org/abs/2505.13763'}
      role: representative
      tier: D
      deck_rank: 999
      why: 'The neurofeedback paradigm quantifying report and control of activation directions and introducing the low-dimensional metacognitive space — the central method for this subsection.'
    - title: 'The Internal State of an LLM Knows When It''s Lying'
      venue: 'EMNLP Findings 2023'
      links: {'paper': 'https://aclanthology.org/2023.findings-emnlp.68/'}
      role: foundational
      tier: D
      deck_rank: 999
      why: 'First to show hidden-layer probes beat conditioning probabilities at truthfulness detection — the original latent-signal monitoring result.'
    - title: 'LLM Evaluators Recognize and Favor Their Own Generations'
      venue: 'NeurIPS 2024'
      links: {'paper': 'https://arxiv.org/abs/2404.13076'}
      role: representative
      tier: D
      deck_rank: 999
      why: 'Causal link between self-recognition and self-preference shows introspection-like access is real and simultaneously a safety hazard, motivating the critical framing of this subsection.'
    - title: 'Language Models (Mostly) Know What They Know'
      venue: 'arXiv 2022'
      links: {'paper': 'https://arxiv.org/abs/2207.05221'}
      role: foundational
      tier: D
      deck_rank: 999
      why: 'Establishes that models carry a usable internal signal (P(True), P(IK)) about answer correctness, grounding the entire monitoring literature.'
    - title: 'Decoupling Metacognition from Cognition: A Framework for Evaluating Metacognition in LLMs'
      venue: 'AAAI 2025'
      links: {'paper': 'https://doi.org/10.1609/aaai.v39i24.34723'}
      role: representative
      tier: D
      deck_rank: 999
      why: 'Operationalizes ''genuinely metacognitive'' as ability independent of cognitive ability, giving the definition boundary a quantitative test.'
    - title: 'LLMs Have Intrinsic Meta-Cognition, but Need a Good Lens'
      venue: 'EMNLP 2025'
      links: {'paper': 'https://aclanthology.org/2025.emnlp-main.171/'}
      role: representative
      tier: D
      deck_rank: 999
      why: 'Distinguishes the intrinsic metacognitive signal from the imperfect readout, giving the mechanism-versus-measurement distinction for step-level confidence.'

