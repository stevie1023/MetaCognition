    zh: "走向递归自我改进"
    level: REC
    tag: "Beyond routine learning"
  - id: ch8
    num: "8"
    en: "Open Challenges"
    zh: "开放挑战"
    level: GAPS
    tag: "Definitions / causality / risk"

