# Taxonomy: Metacognition in LLMs & Autonomous Agents — single source of truth
#
# This file drives BOTH deliverables:
#   - figures/figure1_taxonomy.svg   (each leaf -> one node in the main figure)
#   - README.md                      (each leaf -> one #### section)
# Never edit the figure or README structure directly; edit here and re-render.
#
# ------------------------------------------------------------------ two facets
#
# FACET 1 — role (逻辑作用): what job a citation does in the argument.
#   foundational  - 奠基/定义   provides the definition or theoretical basis
#   representative- 代表方法     representative method / technique
#   contrast      - 对照/竞争   contrast or competing result
#   boundary      - 边界/反例   boundary case / negative or null result
#   benchmark     - 评测/基准   measurement, benchmark, or metric
#   positioning   - 立场/综述   survey, position, or framing work
#
# FACET 2 — tier (证据层级): how directly the work bears on the claim.
#   D - primary metacognitive study; directly studies the stated concept
#   A - adjacent / enabling; supplies machinery the metacognitive claim uses
#   B - boundary; tests or limits the claim
#   S - survey synthesis / this survey's own analytical proposal
#
# Both facets are recorded per paper. The tier mediates how much weight a
# citation may carry: only D-tier evidence is allowed to ground a positive
# claim about metacognition itself.
#
# status: draft = awaiting user approval; locked = user approved, safe to build on

meta:
  title: "Metacognition in Large Language Models & Autonomous Agents"
  subtitle: "An L0–L2 taxonomy of representing, regulating, and learning cognition"
  tagline: "with utility-aware evaluation and a bounded RSI extension"
  status: draft
  version: 0.2

# ------------------------------------------------------------------ levels
# The level thread that runs through the whole paper. Chapters map onto it.
#   short = the abbreivated form the figure prints in the left gutter
#   desc  = the one-line gloss under it (same words in figure and README)
levels:
  - id: THEORY
    en: "Theory"
    short: "THEORY"
    zh: "理论"
    desc: "Concepts / rationality"
    long: "What metacognition is, and what it is worth."
  - id: FRAMEWORK
    en: "L0–L2 Framework"
    short: "L0–L2"
    zh: "L0–L2 框架"
    desc: "Operational boundary"
    long: "The operational boundary between the three levels."
  - id: L1REP
    en: "Level 1 — Represent"
    short: "L1 · REPRESENT"
    zh: "一阶表征"
    desc: "L0 → L1 information"
    long: "Internal signals about one's own cognitive state."
  - id: L1REG
    en: "Level 1 — Regulate"
    short: "L1 · REGULATE"
    zh: "一阶调控"
    desc: "L1 → L0 intervention"
    long: "Acting on those signals: when / what / how much."
  - id: EVAL
    en: "Evaluation (cross-level, not a level)"
    short: "CROSS-LEVEL EVAL"
    zh: "评测（横跨层级，非独立层级）"
    desc: "Not a new cognitive level"
    long: "Signal validity × realized decision utility."
  - id: L2
    en: "Level 2 — Learn"
    short: "L2 · LEARN"
    zh: "二阶学习"
    desc: "Updates L1 mechanism"
    long: "Improving the monitor and the controller."
  - id: REC
    en: "Recursive Extension"
    short: "RECURSIVE EXT."
    zh: "递归扩展"
    desc: "Beyond routine learning"
    long: "Metacognition applied to the improver itself."
  - id: GAPS
    en: "Research Gaps"
    short: "RESEARCH GAPS"
    zh: "开放挑战"
    desc: "Definitions / causality / risk"
    long: "What the framework cannot yet settle."

# ------------------------------------------------------------------ relation
# The L0 -> L1 -> L2 loop, as drawn above the taxonomy in the figure.
# `analytical synthesis`: the loop is this survey's organising claim, not a
# result attributed to any single cited paper.
relation:
  title: "HIERARCHICAL RELATION"
  note: "analytical synthesis"
  nodes:
    - id: L0
      name: "L0 · Cognitive execution"
      desc: "Task state → reasoning / action"
    - id: L1
      name: "L1 · Monitor → Expected utility → Control"
      desc: "Observe L0 cognition; choose when / what / how much to regulate"
    - id: L2
      name: "L2 · Learn M / Q / policy"
      desc: "Experience → improved regulation"
  edges:
    - { from: "L0", to: "L1", label: "state / trace" }
    - { from: "L1", to: "L0", label: "control action" }
    - { from: "L2", to: "L1", label: "policy update" }
    - { from: "L1", to: "L2", label: "outcomes / credit" }
  statement: "Evaluation spans levels: signal validity | realized decision utility | compute-matched ΔU1 (L1→L0) | improvement gain ΔU2 (L2→L1)"
  caveat: "RSI is a recursive extension, not Level 3."

# ------------------------------------------------------------------ chapters
chapters:
  - id: ch1
    num: "1"
    en: "Foundations"
    zh: "基础"
    level: THEORY
    tag: "Concepts / rationality"
  - id: ch2
    num: "2"
    en: "Hierarchical Framework"
    zh: "层级框架"
    level: FRAMEWORK
    tag: "Operational boundary"
  - id: ch3
    num: "3"
    en: "Metacognitive Monitoring"
    zh: "元认知监控"
    level: L1REP
    tag: "L0 → L1 information"
  - id: ch4
    num: "4"
    en: "Metacognitive Decision & Control"
    zh: "元认知决策与控制"
    level: L1REG
    tag: "L1 → L0 intervention"
  - id: ch5
    num: "5"
    en: "Evaluation of Metacognitive Utility"
    zh: "元认知效用评测"
    level: EVAL
    tag: "Not a new cognitive level"
  - id: ch6
    num: "6"
    en: "Meta-Regulation"
    zh: "元调控"
    level: L2
    tag: "Updates L1 mechanism"
  - id: ch7
    num: "7"
