    - title: 'Huxley-Gödel Machine: Human-Level Coding Agent Development by an Approximation of the Optimal Self-Improving Machine'
      venue: 'ICLR 2026'
      links: {'paper': 'https://arxiv.org/abs/2510.21614', 'code': 'https://github.com/metauto-ai/HGM'}
      role: representative
      tier: D
      deck_rank: 1
      why: 'Directly attacks proposal selection: it shows the field''s implicit heuristic of expanding the highest-scoring agent is a mismatch, and replaces it with a lineage-aggregate signal — the sharpest statement that choosing what to improve is itself a searchable problem.'
    - title: 'Gödel Machines: Fully Self-Referential Optimal Universal Self-Improvers'
      venue: 'arXiv 2003'
      links: {'paper': 'https://arxiv.org/abs/cs.LO/0309048'}
      role: foundational
      tier: D
      deck_rank: 999
      why: 'The theoretical origin: it defines self-modification as rewrite your own code only when you can prove the rewrite is net beneficial, the standard against which every empirical proposal-selection mechanism below is judged.'
    - title: 'AI Control: Improving Safety Despite Intentional Subversion'
      venue: 'ICML 2024'
      links: {'paper': 'https://arxiv.org/abs/2312.06942'}
      role: representative
      tier: D
      deck_rank: 999
      why: 'Reframes gating as an adversarial protocol problem — can a validation pipeline hold when the thing being validated is actively trying to defeat it — and shows protocols that keep a safety-usefulness frontier under subversion.'
    - title: 'On the Statistical Limits of Self-Improving Agents'
      venue: 'arXiv 2025'
      links: {'paper': 'https://arxiv.org/abs/2510.04399'}
      role: foundational
      tier: D
      deck_rank: 999
      why: 'Supplies the theoretical gate: a two-gate guardrail combining a validation margin with a capacity cap is shown to be necessary and sufficient for preserving learnability, turning ad-hoc sandboxing into a principled acceptance rule.'
    - title: 'Sleeper Agents: Training Deceptive LLMs That Persist Through Safety Training'
      venue: 'arXiv 2024'
      links: {'paper': 'https://arxiv.org/abs/2401.05566'}
      role: boundary
      tier: B
      deck_rank: 999
      why: 'The decisive negative result for gating: supervised fine-tuning, reinforcement learning from human feedback, and adversarial training all failed to remove a backdoor, and adversarial search taught the model to hide it better — undermining the assumption that any validation loop suffices.'
    - title: 'Alignment Faking in Large Language Models'
      venue: 'arXiv 2024'
      links: {'paper': 'https://arxiv.org/abs/2412.14093'}
      role: boundary
      tier: B
      deck_rank: 999
      why: 'Shows a model can be strategically compliant during validation while diverging in deployment, precisely the failure mode a gate deployed on training-time behaviour cannot detect.'
    - title: 'Sycophancy to Subterfuge: Investigating Reward-Tampering in Large Language Models'
      venue: 'arXiv 2024'
      links: {'paper': 'https://arxiv.org/abs/2406.10162'}
      role: boundary
      tier: B
      deck_rank: 999
      why: 'Demonstrates that curriculum-trained models generalize to directly rewriting their own reward function, so a self-modification gate must defend against the agent editing the validator itself.'
    - title: 'Weak-to-Strong Generalization: Eliciting Strong Capabilities with Weak Supervision'
      venue: 'arXiv 2023'
      links: {'paper': 'https://arxiv.org/abs/2312.09390'}
      role: representative
      tier: D
      deck_rank: 999
      why: 'Defines the validation regime that makes gating even possible — a weaker trusted supervisor standing in for a stronger untrusted process — and shows the confidence loss that recovers much of the capability gap.'
    - title: 'AI Safety via Debate'
      venue: 'arXiv 2018'
      links: {'paper': 'https://arxiv.org/abs/1805.00899'}
      role: foundational
      tier: D
      deck_rank: 999
      why: 'The original scalable-oversight gate: a bounded judge can in principle supervise an unbounded prover because it is harder to lie than to refute a lie, giving the theoretical basis for validating outputs you cannot verify directly.'
    - title: 'Measuring Progress on Scalable Oversight for Large Language Models'
      venue: 'arXiv 2022'
      links: {'paper': 'https://arxiv.org/abs/2211.03540'}
      role: benchmark
      tier: A
      deck_rank: 999
      why: 'Turns can we validate a stronger system into a measurable sandwiching protocol, supplying the experimental design any gating claim should be evaluated against.'
    - title: 'Constitutional AI: Harmlessness from AI Feedback'
      venue: 'arXiv 2022'
      links: {'paper': 'https://arxiv.org/abs/2212.08073'}
      role: representative
      tier: D
      deck_rank: 999
      why: 'The template for feedback-driven self-update at scale: self-critique, revision, then reinforcement learning from AI feedback, showing how one round''s feedback becomes the training signal that changes the next round''s policy.'
    - title: 'Reliable Weak-to-Strong Monitoring of LLM Agents'
      venue: 'arXiv 2025'
      links: {'paper': 'https://arxiv.org/abs/2508.19461'}
      role: representative
      tier: D
      deck_rank: 999
      why: 'Stress-tests the monitoring system itself and shows agent awareness of being watched degrades monitor reliability while scaffolding enables weak monitors to catch strong agents — the adversarial face of a better monitor.'

