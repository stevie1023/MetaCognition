      venue: 'ICLR 2024'
      links: {'paper': 'https://arxiv.org/abs/2402.10877'}
      role: foundational
      tier: D
      deck_rank: 999
      why: 'Proves that generalizing under distributional shift requires having learned an approximate causal world model — the theoretical boundary on what cross-task transfer can and cannot be.'

